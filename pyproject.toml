[project]
name = "cra_risk_management"
version = "0.1.3"
description = "Package to geospatial analysis and statistics."
authors = [{ name = "Sebástian Andrés Narváez Salcedo", email = "snarvaezwrm@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=3.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.11.0",
    "prepare-wfs-data>=0.1.2",
    "requests>=2.34.2",
]

[tool.hatch.build.targets.sdist]
include = ["src/cra_risk_management"]

[tool.hatch.build.targets.wheel]
include = ["src/cra_risk_management"]

[tool.hatch.build.targets.wheel.sources]
"src/cra_risk_management" = "cra_risk_management"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.2)"
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "missing-copyright-notice",
    "incorrect-blank-line-before-class",          # incompatible with D211
    "multi-line-summary-second-line",             # incompatible with D212
    "missing-trailing-comma",                     # incompatible with formatter
    "single-line-implicit-string-concatenation",  # incompatible with formatter
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["undocumented-public-module", "undocumented-public-package"]
